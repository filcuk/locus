# Production-shaped layout: user-supplied Postgres + API (DESIGN §9).
# Postgres is the only extra service; no sync sidecar.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-locus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locus}
      POSTGRES_DB: ${POSTGRES_DB:-locus}
    volumes:
      - locus-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: locus-api:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-locus}:${POSTGRES_PASSWORD:-locus}@db:5432/${POSTGRES_DB:-locus}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      MEDIA_ROOT: /data/media
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    volumes:
      - locus-media:/data/media
    restart: unless-stopped

volumes:
  locus-pg:
  locus-media:
